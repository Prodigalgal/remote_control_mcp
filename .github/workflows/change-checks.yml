name: Change checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      native_agent_checks:
        description: "Also validate Linux/Windows Native Agent contracts without publishing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: change-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect component changes
    runs-on: ubuntu-latest
    outputs:
      center: ${{ steps.filter.outputs.center }}
      agent: ${{ steps.filter.outputs.agent }}
      console: ${{ steps.filter.outputs.console }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == 'workflow_dispatch' ]]; then
            printf 'center=true\nagent=true\nconsole=true\ncontract=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          for component in center agent console contract; do
            value="$(python3 scripts/detect-component-changes.py "${component}" --base "${BASE_SHA}" --head "${SHA}")"
            echo "${component}=${value}" >> "${GITHUB_OUTPUT}"
          done

  repository-hygiene:
    name: Repository hygiene
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked files without echoing matches
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/scan-repository-secrets.sh
          python3 scripts/verify-agent-boundaries.py
          python3 -m unittest scripts/test_verify_release.py
          python3 -m unittest scripts/test_verify_release_recovery.py
          python3 -m unittest scripts/test_detect_component_changes.py
          python3 -m unittest scripts/test_prepare_component_release.py
          python3 -m unittest scripts/test_push_gitops_component.py
      - name: Enforce event-driven wait paths
        shell: bash
        run: bash scripts/check-event-driven.sh
      - name: Validate public Java production overlay template
        shell: bash
        run: bash scripts/validate-java-production-overlay.sh --template
      - name: Validate single MCP model surface
        run: node scripts/check-mcp-tool-surface.mjs
      - name: Browser tool contract tests
        run: node --test scripts/browser-worker.test.mjs
      - name: Artifact presentation contracts
        run: node --test scripts/artifact-viewer.test.mjs

  windows-scripts:
    name: Windows script recovery contracts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Windows-owned startup host and failure recovery
        shell: powershell
        run: .\scripts\test-windows-scripts.ps1

  browser-runtime:
    name: Browser runtime gate
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    uses: ./.github/workflows/browser-runtime-check.yml

  center-test:
    name: Center selective test
    needs: changes
    if: needs.changes.outputs.center == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: remote_control_mcp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d remote_control_mcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RCM_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/remote_control_mcp
      RCM_TEST_POSTGRES_USERNAME: postgres
      RCM_TEST_POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: bash scripts/sync-artifact-viewer.sh
      - name: Center tests
        working-directory: java
        run: bash ./gradlew :protocol:test :center:test --no-daemon

  agent-test:
    name: Agent selective test
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Agent, Desktop and Browser tests
        working-directory: java
        run: bash ./gradlew :agent:test :desktop:test :browser:test --no-daemon

  native-agent-checks:
    name: Native Agent contracts (${{ matrix.os }})
    needs: agent-test
    if: github.event_name == 'workflow_dispatch' && inputs.native_agent_checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: false
      - name: Compile and validate Native Agent metadata and encodings
        working-directory: java
        shell: pwsh
        run: |
          if ($IsWindows) { & .\gradlew.bat -PnativeMarch=x86-64-v2 :agent:nativeCompile --no-daemon }
          else {
            # Validate the actual Linux release builder, including its locale,
            # rather than the different encoding defaults of the CI runner JDK.
            & docker build --build-arg RCM_CI_BUILD=true --build-arg RCM_NATIVE_MARCH=x86-64-v2 --file Dockerfile.agent.native --target artifact --output type=local,dest=agent/build/native/nativeCompile .
          }
          if ($LASTEXITCODE -ne 0) { throw 'Native Agent compilation failed' }
          $binary = if ($IsWindows) { './agent/build/native/nativeCompile/rcm-agent.exe' } else { './agent/build/native/nativeCompile/rcm-agent' }
          $env:REMOTE_CONTROL_MCP_AGENT_CENTER_URL = 'https://center.invalid'
          $env:REMOTE_CONTROL_MCP_AGENT_NAME = 'ci-native-file-check'
          $env:REMOTE_CONTROL_MCP_AGENT_STATE_DIR = Join-Path $env:RUNNER_TEMP 'native-file-contracts'
          if (-not $IsWindows) { $env:LANG = 'C'; $env:LC_ALL = 'C' }
          & $binary --check-config
          if ($LASTEXITCODE -ne 0) { throw 'Native Agent file/metadata/encoding contracts failed' }

  console-test:
    name: Console selective test
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v10.15.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Console build
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Console filesystem browser checks
        working-directory: web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
      - name: Console preview and browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-preview-and-browser-evidence
          path: |
            web/dist
            web/test-results
            web/playwright-report
          retention-days: 7
