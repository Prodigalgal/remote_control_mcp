apiVersion: v1
kind: Secret
metadata:
  name: remote-control-mcp-secrets
  namespace: remote-control-mcp
type: Opaque
stringData:
  admin-token: replace-with-console-admin-token
  artifact-signing-secret: replace-with-independent-artifact-signing-secret
  database-url: jdbc:postgresql://postgres.example.invalid:5432/remote_control_mcp
  database-username: replace-with-database-user
  database-password: replace-with-database-password
  # Optional Gemini pre-registered client: supply all three keys together.
  # gemini-oauth-client-id: replace-with-generated-client-id
  # gemini-oauth-client-secret: replace-with-high-entropy-client-secret
  # gemini-oauth-redirect-uris: https://oauth-redirect.googleusercontent.com/r/replace-with-app-specific-id
